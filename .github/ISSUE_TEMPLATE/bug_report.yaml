name: Bug Report
description: Something seems broken or not as it should be
title: "[Bug] "
labels: ["bug"]
projects: []
assignees:
  - Erallie
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing issues and bugs and have not found the same bug I experienced.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: "Tell us what happened."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: "Tell us what you expected."
    validations:
      required: true
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: Please provide any screenshots that can help showcase the problem.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: What platform are you experiencing this bug on?
      placeholder: "e.g. iOS/Android/Windows/MacOS/Linux"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
      value: "Type here"
    validations:
      required: false
